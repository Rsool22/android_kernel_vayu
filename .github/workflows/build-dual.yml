name: Vayu-AnyMore ReSukiSU+SuSFS+KPM (DEV&MAIN)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual build'
        required: false
        default: 'Manual trigger'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # silences Node 20 deprecation warnings

jobs:
  # ── Check both branches for updates ────────────────────────────────────────
  check-updates:
    name: Check ReSukiSU for updates (dev + main)
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.compare.outputs.has_updates }}
      dev_sha:     ${{ steps.shas.outputs.dev_sha }}
      main_sha:    ${{ steps.shas.outputs.main_sha }}
      ksu_version: ${{ steps.ksu_ver.outputs.ksu_version }}
    steps:
      - name: Get current ReSukiSU SHAs
        id: shas
        run: |
          DEV=$(git ls-remote https://github.com/ReSukiSU/ReSukiSU.git refs/heads/dev | cut -f1)
          MAIN=$(git ls-remote https://github.com/ReSukiSU/ReSukiSU.git refs/heads/main | cut -f1)
          echo "dev_sha=${DEV}"   >> $GITHUB_OUTPUT
          echo "main_sha=${MAIN}" >> $GITHUB_OUTPUT
          echo "  [CI] dev SHA:  ${DEV}"
          echo "  [CI] main SHA: ${MAIN}"

      - name: Get ReSukiSU driver version
        id: ksu_ver
        run: |
          VER=$(curl -sf "https://api.github.com/repos/ReSukiSU/ReSukiSU/tags" \
                | python3 -c "
          import sys, json
          tags = json.load(sys.stdin)
          print(tags[0]['name'] if tags else 'unknown')
          " 2>/dev/null || echo "unknown")
          echo "ksu_version=${VER}" >> $GITHUB_OUTPUT
          echo "  [CI] ReSukiSU driver version: ${VER}"

      - name: Restore last built SHA cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .last_ksu_shas
          key: ksu-dual-${{ steps.shas.outputs.dev_sha }}-${{ steps.shas.outputs.main_sha }}
          restore-keys: ksu-dual-

      - name: Determine if build is needed
        id: compare
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ] && \
             [ "${{ github.event_name }}" = "schedule" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "  [CI] No new commits on either branch -- skipping build."
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

  # ── Build matrix (dev + main in parallel) ──────────────────────────────────
  build:
    name: Build [${{ matrix.ksu_branch }}]
    needs: check-updates
    if: needs.check-updates.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ksu_branch: [dev, main]
      fail-fast: false
    env:
      KSU_BRANCH: ${{ matrix.ksu_branch }}

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python3 zip curl wget make ccache

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          # Key includes defconfig hash so a config change busts the cache.
          # Run-number suffix lets us always write a new entry while still
          # restoring the closest prior match via restore-keys fallback.
          key: ccache-${{ matrix.ksu_branch }}-${{ hashFiles('arch/arm64/configs/vayu_defconfig') }}-${{ github.run_number }}
          restore-keys: |
            ccache-${{ matrix.ksu_branch }}-${{ hashFiles('arch/arm64/configs/vayu_defconfig') }}-
            ccache-${{ matrix.ksu_branch }}-

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --set-config=compiler_check=content
          ccache --set-config=compression=true
          ccache --set-config=compression_level=1
          ccache -z
          echo "CCACHE_DIR=${HOME}/.ccache" >> $GITHUB_ENV

      - name: Download ZyC Clang 23.x
        run: bash .github/scripts/fetch_clang.sh

      - name: Setup ReSukiSU driver (${{ matrix.ksu_branch }} branch)
        run: |
          bash <(curl -LSs https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh) ${{ matrix.ksu_branch }}

      - name: Apply KSU hook guards
        run: |
          KERNEL_DIR="${GITHUB_WORKSPACE}" python3 scripts/apply_ksu_guards.py

      - name: Build kernel
        env:
          BUILD_COUNTER_OFFSET: ${{ vars.BUILD_COUNTER_OFFSET }}
        run: |
          chmod +x .github/scripts/ci_build.sh
          bash .github/scripts/ci_build.sh

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.ksu_branch }}-${{ hashFiles('arch/arm64/configs/vayu_defconfig') }}-${{ github.run_number }}

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.ksu_branch }}
          path: Anykernel-Builds/*.zip
          retention-days: 1

  # ── Create single release with both zips ───────────────────────────────────
  release:
    name: Create Combined Release
    needs: [check-updates, build]
    if: needs.check-updates.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download DEV zip
        uses: actions/download-artifact@v4
        with:
          name: kernel-dev
          path: release/

      - name: Download MAIN zip
        uses: actions/download-artifact@v4
        with:
          name: kernel-main
          path: release/

      - name: Download ReSukiSU Manager Artifacts (dev + main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release/

          # Artifact names to fetch → output base name
          WANTED=(
            "Manager-release|ReSukiSU-Manager"
            "Spoofed-Manager-release|ReSukiSU-Spoofed-Manager"
          )

          for BRANCH in dev main; do
            BRANCH_TAG=$(echo "$BRANCH" | tr '[:lower:]' '[:upper:]')
            echo "  [CI] ── Branch: ${BRANCH_TAG} ──────────────────────────────"

            # Fetch up to 20 recent runs filtered by event=push AND branch=<target>.
            # Then double-check head_branch == exactly our target in Python, because
            # the API branch= param can match branches that merely share a prefix
            # (e.g. "dev-fix" leaking into a "dev" query).
            RUN_ID=$(curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/ReSukiSU/ReSukiSU/actions/runs?event=push&branch=${BRANCH}&status=success&per_page=20" \
              | python3 -c "
          import sys, json
          target = '${BRANCH}'
          for r in json.load(sys.stdin).get('workflow_runs', []):
              if r.get('head_branch') == target:
                  print(r['id']); break
          ")

            if [ -z "$RUN_ID" ]; then
              echo "  [CI] No qualifying push run found for branch ${BRANCH} -- skipping managers."
              continue
            fi
            echo "  [CI] Using run ${RUN_ID} for ${BRANCH_TAG} managers."

            # List artifacts for that run
            ARTIFACTS_JSON=$(curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/ReSukiSU/ReSukiSU/actions/runs/${RUN_ID}/artifacts")

            for ENTRY in "${WANTED[@]}"; do
              ARTIFACT_NAME="${ENTRY%%|*}"
              OUT_BASE="${ENTRY##*|}"
              OUT_FILE="release/${OUT_BASE}-${BRANCH_TAG}.zip"

              ARTIFACT_ID=$(echo "$ARTIFACTS_JSON" | python3 -c "
          import sys, json
          target = '${ARTIFACT_NAME}'
          for a in json.load(sys.stdin).get('artifacts', []):
              if a['name'] == target:
                  print(a['id']); break
          ")

              # Manager bundles aren't always present in every push run.
              # Skip silently -- do not fail the release over missing managers.
              if [ -z "$ARTIFACT_ID" ]; then
                echo "  [CI] '${ARTIFACT_NAME}' absent from run ${RUN_ID} -- skipping."
                continue
              fi

              echo "  [CI] Downloading '${ARTIFACT_NAME}' -> $(basename "${OUT_FILE}")..."
              curl -LSs \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -o "${OUT_FILE}" \
                "https://api.github.com/repos/ReSukiSU/ReSukiSU/actions/artifacts/${ARTIFACT_ID}/zip"
              echo "  [CI] Saved: ${OUT_FILE} ($(du -h "${OUT_FILE}" | cut -f1))"
            done
          done

          echo ""
          echo "  [CI] Release folder contents:"
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dual-build-${{ github.run_number }}
          name: "Vayu-Anymore Kernel ReSukiSU Edition [Drivers=${{ needs.check-updates.outputs.ksu_version }}]"
          body: |
            ## Vayu-Anymore Kernel — ReSukiSU Edition
            **Build:** #${{ github.run_number }}
            **ReSukiSU Drivers:** `${{ needs.check-updates.outputs.ksu_version }}`
            **Trigger:** ${{ github.event_name == 'schedule' && 'Scheduled (daily)' || inputs.reason }}

            ### 📦 Kernel Packages
            | File | Branch | Features |
            |------|--------|----------|
            | `*DEV*.zip`  | 🟡 DEV  | ReSukiSU DEV + SuSFS Inline Hook + KPM |
            | `*MAIN*.zip` | 🟢 MAIN | ReSukiSU MAIN + SuSFS Inline Hook + KPM |

            ### 📱 Manager Packages
            > Pulled from the latest ReSukiSU push build on each branch.
            > Manager zips may be absent if that run did not produce them.

            | File | Branch | Type |
            |------|--------|------|
            | `ReSukiSU-Manager-DEV.zip`          | 🟡 DEV  | Standard Manager |
            | `ReSukiSU-Spoofed-Manager-DEV.zip`  | 🟡 DEV  | Spoofed Manager  |
            | `ReSukiSU-Manager-MAIN.zip`         | 🟢 MAIN | Standard Manager |
            | `ReSukiSU-Spoofed-Manager-MAIN.zip` | 🟢 MAIN | Spoofed Manager  |

            ### ⚡ Installation
            1. Flash the kernel zip matching your branch preference via recovery (requires Android 16).
            2. Extract the matching Manager zip, install the APK, and grant root access.
          files: release/*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Save SHA cache after successful release ─────────────────────────────────
  save-cache:
    name: Save ReSukiSU SHA cache
    needs: [check-updates, release]
    if: needs.check-updates.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Save combined SHA cache
        uses: actions/cache/save@v4
        with:
          path: .last_ksu_shas
          key: ksu-dual-${{ needs.check-updates.outputs.dev_sha }}-${{ needs.check-updates.outputs.main_sha }}
