name: Build · vayu Android 16 Kernel (ReSukiSU MAIN + DEV)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual trigger'
      reset_counter:
        description: 'Reset the build number counter back to #1'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # suppress Node 20 deprecation warnings

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # 0. Optionally reset the build number counter
  # ─────────────────────────────────────────────────────────────────────────────
  reset-counter:
    name: Reset build counter
    if: github.event_name == 'workflow_dispatch' && inputs.reset_counter == true
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Set BUILD_COUNTER_OFFSET so next release shows #1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Offset = run_number - 1  →  display = run_number - offset = 1
          OFFSET=$(( ${{ github.run_number }} - 1 ))
          echo "  [CI] Resetting build counter: run #${{ github.run_number }} will display as #1 (offset=${OFFSET})"

          # PATCH updates an existing variable; POST creates it if absent
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/variables/BUILD_COUNTER_OFFSET" \
            -f "value=${OFFSET}" 2>/dev/null \
          || \
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/variables" \
            -f "name=BUILD_COUNTER_OFFSET" \
            -f "value=${OFFSET}"

          echo "  [CI] BUILD_COUNTER_OFFSET set to ${OFFSET} ✓"

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Check both ReSukiSU branches for upstream changes
  # ─────────────────────────────────────────────────────────────────────────────
  check-updates:
    name: Check ReSukiSU for updates (main + dev)
    needs: reset-counter
    if: always()
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.compare.outputs.has_updates }}
      dev_sha:     ${{ steps.shas.outputs.dev_sha }}
      main_sha:    ${{ steps.shas.outputs.main_sha }}

    steps:
      - name: Fetch current ReSukiSU HEAD SHAs
        id: shas
        run: |
          DEV=$(git ls-remote https://github.com/ReSukiSU/ReSukiSU.git refs/heads/dev  | cut -f1)
          MAIN=$(git ls-remote https://github.com/ReSukiSU/ReSukiSU.git refs/heads/main | cut -f1)
          echo "dev_sha=${DEV}"   >> $GITHUB_OUTPUT
          echo "main_sha=${MAIN}" >> $GITHUB_OUTPUT
          echo "  [CI] dev  SHA: ${DEV}"
          echo "  [CI] main SHA: ${MAIN}"

      - name: Restore SHA cache from last successful build
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .last_ksu_shas
          key: ksu-dual-${{ steps.shas.outputs.dev_sha }}-${{ steps.shas.outputs.main_sha }}
          restore-keys: ksu-dual-

      - name: Decide whether a build is needed
        id: compare
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ] && \
             [ "${{ github.event_name }}" = "schedule" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "  [CI] No new commits on either branch — skipping build."
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "  [CI] Updates detected (or manual trigger) — proceeding with build."
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Build kernel (matrix: main + dev in parallel)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build [${{ matrix.ksu_branch }}]
    needs: check-updates
    if: needs.check-updates.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        ksu_branch: [main, dev]
      fail-fast: false

    env:
      KSU_BRANCH: ${{ matrix.ksu_branch }}
      # ── ccache ───────────────────────────────────────────────────────────────
      CCACHE_DIR:        /home/runner/.ccache
      CCACHE_DIRECT:     1
      CCACHE_NOHASHDIR:  1
      CCACHE_SLOPPINESS: random_seed,include_file_mtime,include_file_ctime
      CCACHE_BASEDIR:    ${{ github.workspace }}

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python3 zip curl wget make ccache

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ matrix.ksu_branch }}-${{ hashFiles('arch/arm64/configs/vayu_defconfig') }}-${{ github.run_number }}
          restore-keys: |
            ccache-${{ matrix.ksu_branch }}-${{ hashFiles('arch/arm64/configs/vayu_defconfig') }}-
            ccache-${{ matrix.ksu_branch }}-

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --set-config=compiler_check=content
          ccache --set-config=compression=true
          ccache --set-config=compression_level=1
          ccache -z

      - name: Download ZyC Clang 23.x
        run: bash .github/scripts/fetch_clang.sh

      - name: Install ReSukiSU driver (${{ matrix.ksu_branch }} branch)
        run: |
          bash <(curl -LSs https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh) \
            ${{ matrix.ksu_branch }}

      - name: Apply KSU hook guards
        run: KERNEL_DIR="${GITHUB_WORKSPACE}" python3 scripts/apply_ksu_guards.py

      - name: Compute display build number
        run: |
          OFFSET="${{ vars.BUILD_COUNTER_OFFSET }}"
          NUM=$(( ${{ github.run_number }} - ${OFFSET:-0} ))
          [ "$NUM" -lt 1 ] && NUM=1
          echo "  [CI] Run #${{ github.run_number }} → Display build #${NUM} (offset=${OFFSET:-0})"
          echo "DISPLAY_BUILD_NUM=${NUM}" >> $GITHUB_ENV

      - name: Build kernel
        env:
          BUILD_COUNTER_OFFSET: ${{ vars.BUILD_COUNTER_OFFSET }}
          DISPLAY_BUILD_NUM: ${{ env.DISPLAY_BUILD_NUM }}
        run: |
          chmod +x .github/scripts/ci_build.sh
          bash .github/scripts/ci_build.sh

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ matrix.ksu_branch }}-${{ hashFiles('arch/arm64/configs/vayu_defconfig') }}-${{ github.run_number }}

      - name: Upload kernel zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.ksu_branch }}
          path: |
            Anykernel-Builds/*.zip
            Anykernel-Builds/ksu_version_*.txt
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Publish rolling release with both zips + Manager APKs
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [check-updates, build]
    if: needs.check-updates.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (for gh CLI repo context)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download MAIN kernel zip
        uses: actions/download-artifact@v4
        with:
          name: kernel-main
          path: release/

      - name: Download DEV kernel zip
        uses: actions/download-artifact@v4
        with:
          name: kernel-dev
          path: release/

      - name: Fetch ReSukiSU Manager APKs (main + dev)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release/

          # Walk the last 30 successful push-triggered runs per branch,
          # newest first, and grab the first run that has the artifact
          # still available (not expired). This ensures we only pull from
          # signed push builds, never from scheduled or unsigned runs.

          ARTIFACT_NAMES=(
            "Manager-release|ReSukiSU-Manager"
            "Spoofed-Manager-release|ReSukiSU-Spoofed-Manager"
          )

          for BRANCH_TAG in MAIN DEV; do
            BRANCH_LC="${BRANCH_TAG,,}"

            echo ""
            echo "  [CI] ── ${BRANCH_TAG} manager (branch=${BRANCH_LC}, event=push) ──"

            RUNS=$(curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/ReSukiSU/ReSukiSU/actions/runs?branch=${BRANCH_LC}&event=push&status=success&per_page=30" \
              | python3 -c "
          import sys, json
          runs = json.load(sys.stdin).get('workflow_runs', [])
          print('\n'.join(str(r['id']) for r in runs))
          " || true)

            if [ -z "$RUNS" ]; then
              echo "  [CI] No successful push runs found on '${BRANCH_LC}' — skipping."
              continue
            fi

            for ENTRY in "${ARTIFACT_NAMES[@]}"; do
              ARTIFACT_NAME="${ENTRY%%|*}"
              OUT_BASE="${ENTRY##*|}"
              OUT_FILE="release/${OUT_BASE}-${BRANCH_TAG}.zip"

              echo "  [CI] Looking for '${ARTIFACT_NAME}' on branch '${BRANCH_LC}'..."

              ARTIFACT_ID=""
              while IFS= read -r RUN_ID; do
                [ -z "$RUN_ID" ] && continue

                ARTIFACT_ID=$(curl -sf \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/ReSukiSU/ReSukiSU/actions/runs/${RUN_ID}/artifacts?per_page=20" \
                  | python3 -c "
          import sys, json
          name = '${ARTIFACT_NAME}'
          for a in json.load(sys.stdin).get('artifacts', []):
              if a['name'] == name and not a.get('expired', False):
                  print(a['id']); break
          " || true)

                if [ -n "$ARTIFACT_ID" ]; then
                  echo "  [CI] Found in run ${RUN_ID} (artifact id=${ARTIFACT_ID})"
                  break
                fi
              done <<< "$RUNS"

              if [ -z "$ARTIFACT_ID" ]; then
                echo "  [CI] No non-expired '${ARTIFACT_NAME}' found on '${BRANCH_LC}' — skipping."
                continue
              fi

              echo "  [CI] Downloading → ${OUT_FILE}..."
              curl -LSs \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -o "${OUT_FILE}" \
                "https://api.github.com/repos/ReSukiSU/ReSukiSU/actions/artifacts/${ARTIFACT_ID}/zip"
              echo "  [CI] Saved: ${OUT_FILE} ($(du -h "${OUT_FILE}" | cut -f1))"
            done
          done

          echo ""
          echo "  [CI] Release folder contents:"
          ls -lh release/

      - name: Read ReSukiSU version codes
        run: |
          MAIN_VER=$(cat release/ksu_version_MAIN.txt 2>/dev/null | tr -d '[:space:]' || echo "unknown")
          DEV_VER=$(cat  release/ksu_version_DEV.txt  2>/dev/null | tr -d '[:space:]' || echo "unknown")
          echo "  [CI] Driver versions — MAIN: ${MAIN_VER}  DEV: ${DEV_VER}"
          echo "MAIN_KSU_VERSION=${MAIN_VER}" >> $GITHUB_ENV
          echo "DEV_KSU_VERSION=${DEV_VER}"   >> $GITHUB_ENV
          echo "RELEASE_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_ENV

      - name: Delete existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          sleep 5   # allow GitHub time to propagate the deletion

      - name: Compute display build number
        run: |
          OFFSET="${{ vars.BUILD_COUNTER_OFFSET }}"
          NUM=$(( ${{ github.run_number }} - ${OFFSET:-0} ))
          [ "$NUM" -lt 1 ] && NUM=1
          echo "  [CI] Run #${{ github.run_number }} → Display build #${NUM} (offset=${OFFSET:-0})"
          echo "DISPLAY_BUILD_NUM=${NUM}" >> $GITHUB_ENV

      - name: Write release notes
        run: |
          TRIGGER="${{ github.event_name == 'schedule' && 'Scheduled (daily at 03:00 UTC)' || inputs.reason }}"

          # Note: the heredoc content is indented to satisfy YAML's literal block
          # scalar rules. The trailing sed call strips those leading spaces so
          # the Markdown renders correctly on GitHub.
          cat > /tmp/release_notes.md << 'NOTES'
          <div align="center">

          ### 📦 Poco X3 Pro (`vayu`) · Android 16 Custom Kernel

          **Linux 4.14 NonGKI · ReSukiSU · SUSFS Inline-Hook · KPM · Docker · Droidspaces**

          </div>

          ---

          ## 🔧 Build Info

          | Property | Value |
          |----------|-------|
          | 🏗️ **Build** | #BUILD_NUM |
          | 📅 **Date** | RELEASE_DATE |
          | ⚡ **Trigger** | TRIGGER_VAL |
          | 🐧 **Kernel** | Linux 4.14 NonGKI · arm64 |
          | 🔨 **Toolchain** | ZyC Clang 23.x · LLVM/LLD |
          | 🟢 **ReSukiSU MAIN** | `MAIN_VER` |
          | 🟡 **ReSukiSU DEV** | `DEV_VER` |
          | ✨ **Features** | ReSukiSU · SUSFS Inline-Hook · KPM · Docker · Droidspaces |

          ---

          ## 📥 Kernel Zips

          > Flash **one** zip via [OrangeFox for vayu](https://orangefox.download/device/61310755bb6a91af6a656d0d) or any AnyKernel3-compatible recovery.

          | File | Branch | Driver Version | Description |
          |------|:------:|:--------------:|-------------|
          | `*MAIN*.zip` | 🟢 **MAIN** | `MAIN_VER` | Stable — recommended for daily use |
          | `*DEV*.zip`  | 🟡 **DEV**  | `DEV_VER`  | Latest — newest features, may be less tested |

          ---

          ## 📲 Manager APKs

          > Each zip contains the APK — extract and sideload directly.
          > **Always match the Manager branch to the kernel zip you flashed.**

          | File | Branch | Variant | When to use |
          |------|:------:|:-------:|-------------|
          | `ReSukiSU-Manager-MAIN.zip`         | 🟢 **MAIN** | Standard | Default choice |
          | `ReSukiSU-Spoofed-Manager-MAIN.zip` | 🟢 **MAIN** | GMS-spoofed | ROM fails Play Integrity with standard APK |
          | `ReSukiSU-Manager-DEV.zip`          | 🟡 **DEV**  | Standard | Default choice |
          | `ReSukiSU-Spoofed-Manager-DEV.zip`  | 🟡 **DEV**  | GMS-spoofed | ROM fails Play Integrity with standard APK |

          ---

          ## 🚀 Installation

          **Requirements**
          - 📱 Device: Xiaomi Poco X3 Pro (codename: `vayu`, SM8150)
          - 🔓 Unlocked bootloader + Android 16 ROM
          - 🦊 Recovery: [OrangeFox for vayu](https://orangefox.download/device/61310755bb6a91af6a656d0d) or any TWRP-based recovery

          **Steps**

          1. Boot into recovery.
          2. Flash the kernel zip for your preferred branch (`MAIN` = stable, `DEV` = latest features).
          3. Reboot to system.
          4. Install the matching Manager APK and grant root access when prompted.

          ---

          ## 🐳 Docker Support

          All Generally Necessary Docker configs pass the Moby [check-config.sh](https://github.com/moby/moby/blob/master/contrib/check-config.sh) script. Optional configs viable on 4.14 QCOM are also included.

          > **Note:** Docker on 4.14 requires `iptables-legacy` and the `cgroupfs` driver.
          > `CFS_BANDWIDTH` is unavailable due to `SCHED_WALT=y`.
          > For Termux setup, follow [this guide](https://gist.github.com/FreddieOliveira/efe850df7ff3951cb62d74bd770dce27#23-docker).

          ---

          ## 📦 Droidspaces / LXC

          Full Droidspaces container support is enabled — all required namespaces, cgroup v2 controllers, OverlayFS with redirect + index, networking bridges, TUN, FUSE, and IPC configs are active.

          [🔗 Droidspaces OSS](https://github.com/ravindu644/Droidspaces-OSS) ·
          [📖 Android install guide](https://github.com/ravindu644/Droidspaces-OSS/blob/main/Documentation/Installation-Android.md) ·
          [💾 rootfs downloads](https://github.com/ravindu644/Droidspaces-rootfs-builder/releases/latest)

          ---

          > [!WARNING]
          > **Disclaimer:** Flash at your own risk. I am not responsible for bricked devices, bootloops, or data loss. **Always back up your boot partition before flashing.**
          NOTES

          # Strip the 10-space indent that was required for YAML literal block validity
          sed -i 's/^          //' /tmp/release_notes.md

          # Substitute placeholder tokens with real values
          sed -i \
            -e "s|BUILD_NUM|${DISPLAY_BUILD_NUM}|g"      \
            -e "s|RELEASE_DATE|${RELEASE_DATE}|g"        \
            -e "s|TRIGGER_VAL|${TRIGGER}|g"              \
            -e "s|MAIN_VER|${MAIN_KSU_VERSION}|g"        \
            -e "s|DEV_VER|${DEV_KSU_VERSION}|g"          \
            /tmp/release_notes.md

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            --title "vayu · Android 16 Kernel · Build #${DISPLAY_BUILD_NUM} · MAIN:${MAIN_KSU_VERSION} / DEV:${DEV_KSU_VERSION}" \
            --notes-file /tmp/release_notes.md \
            --latest \
            release/*.zip

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Persist SHA cache so the next scheduled run can skip if nothing changed
  # ─────────────────────────────────────────────────────────────────────────────
  save-cache:
    name: Save ReSukiSU SHA cache
    needs: [check-updates, release]
    if: needs.check-updates.outputs.has_updates == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Save combined SHA cache
        uses: actions/cache/save@v4
        with:
          path: .last_ksu_shas
          key: ksu-dual-${{ needs.check-updates.outputs.dev_sha }}-${{ needs.check-updates.outputs.main_sha }}
