name: Build Vayu Kernel (DEV)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual build'
        required: false
        default: 'Manual trigger'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Check for ReSukiSU updates ─────────────────────────────────────────────
  check-updates:
    name: Check ReSukiSU (dev) for updates
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.compare.outputs.has_updates }}
      dev_sha: ${{ steps.shas.outputs.dev_sha }}
    steps:
      - name: Get current ReSukiSU dev SHA
        id: shas
        run: |
          DEV=$(git ls-remote https://github.com/ReSukiSU/ReSukiSU.git refs/heads/dev | cut -f1)
          echo "dev_sha=${DEV}" >> $GITHUB_OUTPUT
          echo "  [CI] ReSukiSU dev SHA: ${DEV}"

      - name: Restore last built SHA cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .last_ksu_dev_sha
          key: ksu-dev-${{ steps.shas.outputs.dev_sha }}
          restore-keys: ksu-dev-

      - name: Determine if build is needed
        id: compare
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ] && \
             [ "${{ github.event_name }}" = "schedule" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "  [CI] No new commits on ReSukiSU dev -- skipping build."
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

  # ── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build ReSukiSU Kernel (DEV + SuSFS + KPM)
    needs: check-updates
    if: needs.check-updates.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    env:
      KSU_BRANCH: dev

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python3 zip curl wget make

      - name: Download ZyC Clang 23.x
        run: bash .github/scripts/fetch_clang.sh

      - name: Setup ReSukiSU driver (dev branch)
        run: |
          bash <(curl -LSs https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh) dev

      - name: Apply KSU hook guards
        run: |
          KERNEL_DIR="${GITHUB_WORKSPACE}" python3 scripts/apply_ksu_guards.py

      - name: Build kernel
        run: |
          chmod +x .github/scripts/ci_build.sh
          bash .github/scripts/ci_build.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build-${{ github.run_number }}
          name: "VAYU DEV Build #${{ github.run_number }} (${{ github.event_name == 'schedule' && 'Scheduled' || 'Manual' }})"
          body: |
            ## VAYU Kernel — AnyMore Project
            **Build:** #${{ github.run_number }}
            **Branch:** ReSukiSU DEV
            **Trigger:** ${{ github.event_name == 'schedule' && 'Scheduled (daily)' || inputs.reason }}

            ### Features
            - ✅ ReSukiSU (DEV branch)
            - ✅ SuSFS v2.1.0 — Inline Hook
            - ✅ KPM
            - ⏱ Build time: ${{ env.ELAPSED }}

            ### Installation
            Flash via recovery. Requires Android 16.
          files: Anykernel-Builds/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Save SHA cache after successful build ──────────────────────────────────
  save-cache:
    name: Save ReSukiSU SHA cache
    needs: [check-updates, build]
    if: needs.check-updates.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Save dev SHA to cache
        uses: actions/cache/save@v4
        with:
          path: .last_ksu_dev_sha
          key: ksu-dev-${{ needs.check-updates.outputs.dev_sha }}
